# Alembic configuration file
# Tham khảo thêm: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path tới migration scripts
script_location = alembic

# Định dạng tên file migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# DATABASE_URL được override trong env.py từ app/core/config.py
# KHÔNG đặt sqlalchemy.url ở đây để tránh lộ credentials vào Git
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
